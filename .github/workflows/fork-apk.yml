name: Fork APK Build (Split Tunneling)

# Fork-only workflow: builds an installable APK without any repository
# secrets. The private DXcore engine is not downloadable from a fork, so the
# build uses ci/dxcore-stub, a gomobile stub with the exact API surface the
# app's Kotlin layer calls. The UI (including split tunneling) is fully
# functional; the underlying proxy engine is simulated.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "test/**"
      - "ci/**"
      - ".github/workflows/fork-apk.yml"
      - "pubspec.*"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: "stable"
          architecture: "x64"
          cache: false

      - name: Generate .env
        run: |
          cp .env.exmaple .env

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # Gate on analyzer errors only. The repo carries pre-existing
        # upstream warnings and infos (deprecations, unused fields,
        # protected-member accesses) out of this fork's scope, and flutter
        # analyze's exit code does not reliably downgrade them even with
        # --no-fatal-infos/--no-fatal-warnings.
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze_output.txt || true
          if grep -E '^\s*error\s+•' analyze_output.txt; then
            echo "::error::Analyzer errors found (see lines above)"
            exit 1
          fi
          echo "No analyzer errors; pre-existing warnings/infos tolerated."

      - name: Test
        run: flutter test

  build-apk:
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"

      - name: Accept Android SDK licenses
        run: yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install NDKs
        # The app pins NDK 29; the jni plugin (jni_flutter -> :jni) pins
        # 28.2.13676358. Both must be present so each Gradle project resolves
        # its own ndkVersion - forcing a single ndk.dir in local.properties
        # makes them disagree (CXX1104).
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13846066" "ndk;28.2.13676358"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250911085028-6912353760cf
          gomobile init

      - name: Build DXcore stub AAR
        working-directory: ci/dxcore-stub
        run: |
          # Resolve golang.org/x/mobile into go.sum before binding; recent
          # gomobile refuses to bind without it resolvable in the module.
          go mod tidy
          mkdir -p ../../android/app/libs
          gomobile bind -v \
            -target=android \
            -androidapi 23 \
            -ldflags "-checklinkname=0" \
            -o ../../android/app/libs/DXcore.aar \
            ./Android
          ls -la ../../android/app/libs/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: "stable"
          architecture: "x64"
          cache: false

      - name: Generate .env
        run: |
          cp .env.exmaple .env

      - name: Get dependencies
        run: flutter pub get

      # No signing secrets on the fork: omit key.properties entirely so the
      # Gradle config falls back to debug signing and the APK still installs.
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: defyxvpn-fork-apk
          path: build/app/outputs/flutter-apk/app-release.apk
